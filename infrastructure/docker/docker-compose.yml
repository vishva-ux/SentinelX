version: '3.8'

services:
  # Microservices Architecture (Local Development / SaaS Orchestration)
  postgres:
    image: postgres:16-alpine
    container_name: sentinelx-postgres
    environment:
      POSTGRES_DB: sentinelx_db
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: SentinelXPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: sentinelx-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  apigateway:
    build:
      context: ../backend
      dockerfile: src/Microservices/SentinelX.ApiGateway/Dockerfile
    container_name: sentinelx-apigateway
    ports:
      - "5000:80"
    depends_on:
      - postgres
      - redis
      - elasticsearch

volumes:
  postgres_data:
  es_data:
